name: deploy
on: workflow_dispatch

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    package:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Docker Login
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GHCR_ACCESS_TOKEN }}
            - name: Build and push Docker images
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  tags: |
                      ghcr.io/arung-agamani/izuna:${{ github.sha }}
                      ghcr.io/arung-agamani/izuna:latest

    deploy:
        runs-on: ubuntu-latest
        needs: package
        if: needs.package.result == 'success'
        timeout-minutes: 10
        steps:
            - name: Pull and recreate container
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.KUREYA_SSH_HOST }}
                  username: ${{ secrets.KUREYA_SSH_USER }}
                  key: ${{ secrets.KUREYA_SSH_PRIVATE_KEY }}
                  envs: GITHUB_SHA
                  command_timeout: 10m
                  script: |
                      set -e
                      echo "Pulling image ghcr.io/arung-agamani/izuna:$GITHUB_SHA..."
                      export COMMIT_HASH="$GITHUB_SHA"
                      doppler run -- docker compose -f ${{ secrets.COMPOSE_FILE_PATH }} pull izunabot

                      echo "Recreating container..."
                      doppler run -- docker compose -f ${{ secrets.COMPOSE_FILE_PATH }} up -d --no-deps --force-recreate izunabot

                      echo "Waiting for app to be ready..."
                      for i in $(seq 1 60); do
                          if curl -sf http://localhost:8001/api/status > /dev/null 2>&1; then
                              echo "App healthy after ${i}s"
                              exit 0
                          fi
                          sleep 1
                      done
                      echo "WARNING: App did not respond within 60s — last 20 log lines:"
                      docker logs --tail 20 kureya_izunabot
                      exit 1
