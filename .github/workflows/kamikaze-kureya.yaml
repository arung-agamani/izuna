name: deploy
on:
    push:
        branches:
            - dev
    workflow_dispatch:

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    detect-changes:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            src-changed: ${{ steps.changes.outputs.src }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Check if there is change on certain paths
              uses: dorny/paths-filter@v3
              id: changes
              with:
                  filters: |
                      src:
                        - 'src/**'
                        - 'web/**'
                        - 'Dockerfile'
                        - 'package.json'
                        - 'yarn.lock'

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: yarn
            - name: Install dependencies
              run: yarn install --frozen-lockfile
            - name: Generate Prisma client
              run: npx prisma generate
            - name: Typecheck tests
              run: yarn test:types
            - name: Run tests
              run: yarn test
    package:
        runs-on: ubuntu-latest
        needs: [detect-changes, test]
        if: needs.detect-changes.outputs.src-changed == 'true'
        environment: packaging
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Docker Login
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GHCR_ACCESS_TOKEN }}
            - name: Build and push Docker images
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  tags: |
                      ghcr.io/arung-agamani/izuna:${{ github.sha }}
                      ghcr.io/arung-agamani/izuna:latest

    deploy:
        runs-on: ubuntu-latest
        needs: package
        if: needs.package.result == 'success'
        timeout-minutes: 10
        steps:
            - name: Pull and recreate container
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.KUREYA_SSH_HOST }}
                  username: ${{ secrets.KUREYA_SSH_USER }}
                  key: ${{ secrets.KUREYA_SSH_PRIVATE_KEY }}
                  envs: GITHUB_SHA
                  command_timeout: 10m
                  script: |
                      set -e
                      echo "Pulling image ghcr.io/arung-agamani/izuna:$GITHUB_SHA..."
                      export COMMIT_HASH="$GITHUB_SHA"
                      doppler run -- docker compose -f ${{ secrets.COMPOSE_FILE_PATH }} pull izunabot

                      echo "Recreating container..."
                      doppler run -- docker compose -f ${{ secrets.COMPOSE_FILE_PATH }} up -d --no-deps --force-recreate izunabot

                      echo "Waiting for container to be healthy..."
                      for i in $(seq 1 30); do
                          status=$(docker inspect --format='{{.State.Health.Status}}' izunabot 2>/dev/null || echo "missing")
                          if [ "$status" = "healthy" ]; then
                              echo "Container healthy after ${i}s"
                              exit 0
                          fi
                          sleep 1
                      done
                      echo "WARNING: Container did not report healthy within 30s — last 20 log lines:"
                      docker logs --tail 20 izunabot
                      exit 1
