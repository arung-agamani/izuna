name: deploy-dev
on:
    push:
        branches:
            - dev
    workflow_dispatch:
jobs:
    detect-changes:
        runs-on: ubuntu-latest
        outputs:
            src-changed: ${{ steps.changes.outputs.src }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Check if there is change on certain paths
              uses: dorny/paths-filter@v3
              id: changes
              with:
                  filters: |
                      src:
                        - 'src/**'
                        - 'web/**'
                        - 'Dockerfile'
                        - 'package.json'
                        - 'yarn.lock'
    package:
        runs-on: ubuntu-latest
        needs: detect-changes
        if: needs.detect-changes.outputs.src-changed == 'true'
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Docker Login
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GHCR_ACCESS_TOKEN }}
            - name: Build and push Docker images
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  tags: |
                      ghcr.io/arung-agamani/izuna:${{ github.sha }}
                      ghcr.io/arung-agamani/izuna:latest
                  cache-from: type=registry,ref=ghcr.io/arung-agamani/izuna:buildcache
                  cache-to: type=registry,ref=ghcr.io/arung-agamani/izuna:buildcache,mode=max
    deploy:
        runs-on: ubuntu-latest
        needs: package
        if: needs.package.result == 'success'
        steps:
            - name: Deploy to remote server
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.KUREYA_SSH_HOST }}
                  username: ${{ secrets.KUREYA_SSH_USER }}
                  key: ${{ secrets.KUREYA_SSH_PRIVATE_KEY }}
                  envs: GITHUB_SHA
                  script: |
                      set -e
                      echo "🚀 Starting deployment..."
                      echo "📦 Image tag: $GITHUB_SHA"
                      export COMMIT_HASH="${GITHUB_SHA}"
                      doppler run -- docker compose -f ${{ secrets.COMPOSE_FILE_PATH }} up --force-recreate -d izunabot
                      if [ $? -eq 0 ]; then
                        echo "✅ Deployment completed successfully"
                      else
                        echo "❌ Deployment failed"
                        exit 1
                      fi
